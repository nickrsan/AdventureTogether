---
- name: AdventureTogether Server Provisioning & Application Deployment
  hosts: all
  become: yes
  vars:
    project_root: /opt/adventuretogether
    docker_compose_version: "v2.24.5"
    app_domain: "{{ ansible_host | default('localhost') }}"
    postgres_db: adventure_together
    postgres_user: postgres
    django_debug: "False"
    django_q_workers: 4

  roles:
    - role: common
    - role: security
    - role: postgres
    - role: application
